<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salvemos el Planeta - GreenTech</title>
    <style>
    /* Al no ser una gran web y no usarse boostrap para muchos elementos lo sustituiremos por css nativo para ahorrar carga *
        body {
            /* Para no cargar google fontos podemos sustituirlo por fuentes del sistema */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            color: #333;
        }
        .hero-gigante {
        /*Al cambiar la imagen de una url pesada a una imagen local en .webp quitamos carga*/
        background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                      url("imagenes/imagen1.webp");
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            color: white;
        }
        /*Aquí al no usar boostrap podemos eliminar el !important ya que es inutil*/
        .btn-eco {
            background-color: #28a745;
            border-color: #1e7e34;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }
    </style>
  </head>
  <body>
    <main class="hero-gigante">
        <h1>Salvemos el Planeta</h1>
        <p class="lead">Únete a la revolución verde de GreenTech.</p>
        <!--El botón lo reemplazamos por el diseñado anteriormente en css-->
        <button class="btn-eco">Quiero ayudar</button>
    </main>
    </script>
  </body>
</html>
